name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rental_marketplace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rental_marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pip-audit
      - name: Enable PostGIS and pg_trgm for test databases
        run: |
          for db in template1 rental_marketplace; do
            PGPASSWORD=postgres psql -h localhost -U postgres -d "$db" -c "CREATE EXTENSION IF NOT EXISTS postgis; CREATE EXTENSION IF NOT EXISTS pg_trgm;"
          done
      - name: Django system check
        run: python manage.py check --settings=config.settings.test
      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - name: Migrations apply to PostgreSQL + PostGIS
        run: python manage.py migrate --noinput --settings=config.settings.test_postgres
      - name: Tests (SQLite)
        run: python -m pytest -q
      - name: Tests (PostgreSQL + PostGIS)
        run: python -m pytest -q --ds=config.settings.test_postgres
      - name: Production settings refuse unsafe configuration
        run: |
          if DJANGO_SECRET_KEY=x ALLOWED_HOSTS=api.example.com AFRICASTALKING_USERNAME=x AFRICASTALKING_API_KEY=x \
             R2_PRIVATE_BUCKET_NAME=p PAYMENT_PROVIDER=simulator python manage.py check --settings=config.settings.prod; then
            echo "Production settings accepted the payment simulator" && exit 1
          fi
      - name: Dependency vulnerabilities
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Build (no API available; pages fall back gracefully)
        run: npm run build
      - name: Dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
