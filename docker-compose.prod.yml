# Production-style stack: PostGIS, Redis, one-shot migrations, the API, a notifications worker and the site.
#
#   cp backend/.env.example backend/.env      # fill in real secrets; set DEBUG=False
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# TLS is NOT handled here. Put a reverse proxy (Caddy, nginx, a cloud load balancer) in front of
# ports 8000 (API) and 3000 (site); production settings trust X-Forwarded-Proto from it.
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: rental_marketplace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD}
      APP_DB_USER: ${APP_DB_USER:-rental}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rental_marketplace"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: ./backend
    command: ["python", "manage.py", "migrate", "--noinput"]
    env_file: ./backend/.env
    environment: &backend-env
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://${APP_DB_USER:-rental}:${APP_DB_PASSWORD}@db:5432/rental_marketplace
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: "no"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      # Send the first allowed host as the Host header: production settings reject "localhost".
      test: ["CMD", "python", "-c", "import os, urllib.request as u; h = os.environ['ALLOWED_HOSTS'].split(',')[0].strip().lstrip('.'); u.urlopen(u.Request('http://127.0.0.1:8000/healthz/', headers={'Host': h}), timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Sends queued SMS, viewing reminders, overdue-fee reminders and expires unanswered requests.
  # Without this running, none of the time-based features happen.
  worker:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment: *backend-env
    command: ["sh", "-c", "while true; do python manage.py run_notifications || echo 'run_notifications failed; will retry'; sleep ${NOTIFICATION_INTERVAL_SECONDS:-3600}; done"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?set NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_MAPTILER_KEY: ${NEXT_PUBLIC_MAPTILER_KEY:-}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
